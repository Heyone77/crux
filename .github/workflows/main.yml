name: Release Creation

on: 
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag (for example, 2.2.6)'
        required: true
        default: '2.2.6'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      tag_name: ${{ inputs.version || github.ref_name }}
    steps:
    - uses: actions/checkout@v2

    # Substitute the Manifest and Download URLs in the module.json
    - name: Substitute Manifest and Download Links For Versioned Ones
      id: sub_manifest_link_version
      uses: microsoft/variable-substitution@v1
      with:
        files: 'module.json'
      env:
        version: ${{env.tag_name}}
        url: https://github.com/${{github.repository}}
        manifest: https://github.com/${{github.repository}}/releases/latest/download/module.json
        download: https://github.com/${{github.repository}}/releases/download/${{env.tag_name}}/module.zip

    # Create a zip file with all files required by the module to add to the release
    - run: zip -r ./module.zip module.json scripts/ styles/ templates/ lang/ img/ README.md LICENSE.txt ATTRIBUTION.md

    # Create a release for this specific version
    - name: Update Release with Files
      id: create_version_release
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true # Set this to false if you want to prevent updating existing releases
        name: Release ${{ env.tag_name }}
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: './module.json, ./module.zip'
        tag: ${{ env.tag_name }}
        body: Release ${{ env.tag_name }}
